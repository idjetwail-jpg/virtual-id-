<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقة الطالب</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#0f1218;font-family:Tahoma,sans-serif}
.card{width:94%;max-width:560px;aspect-ratio:1.6;background:linear-gradient(135deg,#fff,#eceff4);border-radius:16px;box-shadow:0 10px 30px #0008;padding:12px 16px 16px;box-sizing:border-box;color:#111;display:flex;flex-direction:column;position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.uni{font-size:13px;font-weight:bold;color:#0a9a4a}
.title{font-size:20px;font-weight:bold}
.main{flex:1;display:flex;gap:12px;align-items:center;margin-top:6px}
.photo{width:30%;max-width:105px;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid #ccd}
.info{flex:1;font-size:11px}
.r{display:flex;gap:6px;margin:4px 0}
.r span{color:#777;min-width:70px}
.r b{font-size:12px}
.side{display:flex;align-items:center;gap:8px}
.year{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:bold}
#qr{width:70px;height:70px}
#qr img{width:100%!important;height:100%!important}
.num{direction:ltr;text-align:right;font-size:11px;font-weight:bold;letter-spacing:1px}
.wave{position:absolute;bottom:0;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,#0a9a4a 0 6px,#7fd3a3 6px 12px)}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="uni">جامعة قسنطينة 1</div>
    <div class="title">بطاقة الطالب</div>
  </div>
  <div class="main">
    <img class="photo" src="IMG_6713.jpeg" alt="صورة">
    <div class="info">
      <div class="r"><span>اللقب:</span><b>إيجات</b></div>
      <div class="r"><span>الاسم:</span><b>وائل</b></div>
      <div class="r"><span>الميلاد:</span><b>31/07/2004 قسنطينة</b></div>
      <div class="r"><span>الجامعة:</span><b>جامعة قسنطينة 1</b></div>
      <div class="r"><span>التخصص:</span><b>لغة فرنسية</b></div>
      <div class="r"><span>المستوى:</span><b>ليسانس سنة ثالثة</b></div>
    </div>
    <div class="side">
      <div id="qr"></div>
      <div class="year">السنة الجامعية 2026/2027</div>
    </div>
  </div>
  <div class="num">1206222234300315</div>
  <div class="wave"></div>
</div>
<script>
new QRCode(document.getElementById("qr"),{text:location.href,width:140,height:140});
</script>
</body>
</html>
