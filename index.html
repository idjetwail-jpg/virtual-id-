<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقة طالب</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#eef1f6;font-family:sans-serif}
.card{width:330px;background:#fff;border-radius:16px;box-shadow:0 8px 24px #0002;overflow:hidden}
.head{background:#1e5eff;color:#fff;padding:14px;text-align:center;font-weight:bold}
.body{padding:16px;text-align:center}
.body img.photo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid #1e5eff}
.body p{margin:8px 0}
.num{direction:ltr;letter-spacing:1px;font-weight:bold}
#qr{display:flex;justify-content:center;margin-top:14px}
</style>
</head>
<body>
<div class="card">
<div class="head">جامعة قسنطينة 1</div>
<div class="body">
<img class="photo" src="photo.jpg" alt="صورة">
<h3>إيجات وائل</h3>
<p>التخصص: آداب وفلسفة</p>
<p>المستوى: ليسانس، السنة الثالثة</p>
<p>رقم الطالب:</p>
<p class="num">1206222234300315</p>
<p>السنة الدراسية: 2026/2027</p>
<div id="qr"></div>
</div>
</div>
<script>
new QRCode(document.getElementById("qr"),{text:location.href,width:110,height:110});
</script>
</body>
</html>
