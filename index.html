<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقة الطالب</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 30%,#1c2433,#0b0e14);font-family:Tahoma,sans-serif;overflow:hidden}
.scene{width:94%;max-width:560px;aspect-ratio:1.6;perspective:1100px}
.sway{width:100%;height:100%;transform-style:preserve-3d;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotateY(-9deg) rotateX(4deg)}50%{transform:rotateY(9deg) rotateX(-3deg)}}
.flip{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.4,.2,.2,1);cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;box-sizing:border-box;padding:12px 16px 16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 40px #000a;overflow:hidden;display:flex;flex-direction:column}
.front{background:linear-gradient(135deg,#fff,#e9edf3);color:#111}
.back{background:linear-gradient(135deg,#0a9a4a,#06602e);color:#fff;transform:rotateY(180deg);align-items:center;justify-content:center;text-align:center}
.face::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff7,transparent);transform:skewX(-20deg);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.uni{font-size:13px;font-weight:bold;color:#0a9a4a}
.title{font-size:20px;font-weight:bold}
.main{flex:1;display:flex;gap:12px;align-items:center;margin-top:6px}
.photo{width:30%;max-width:105px;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid #ccd}
.info{flex:1;font-size:11px}
.r{display:flex;gap:6px;margin:4px 0}
.r span{color:#777;min-width:70px}
.r b{font-size:12px}
.year{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:bold}
.num{direction:ltr;font-size:12px;font-weight:bold;letter-spacing:1px}
.front .num{text-align:right}
.wave{position:absolute;bottom:0;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,#0a9a4a 0 6px,#7fd3a3 6px 12px)}
#qr{background:#fff;padding:8px;border-radius:10px;margin:8px 0;width:110px;height:110px;box-sizing:content-box}
#qr img,#qr canvas{width:100%!important;height:100%!important}
.note{font-size:10px;opacity:.8;margin-top:6px}
.hint{color:#8a93a6;font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="scene">
 <div class="sway">
  <div class="flip" id="card">
   <div class="face front">
    <div class="top">
      <div class="uni">جامعة قسنطينة 1</div>
      <div class="title">بطاقة الطالب</div>
    </div>
    <div class="main">
      <img class="photo" src="IMG_6713.jpeg" alt="صورة">
      <div class="info">
        <div class="r"><span>اللقب:</span><b>إيجات</b></div>
        <div class="r"><span>الاسم:</span><b>وائل</b></div>
        <div class="r"><span>الميلاد:</span><b>31/07/2004 قسنطينة</b></div>
        <div class="r"><span>الجامعة:</span><b>جامعة قسنطينة 1</b></div>
        <div class="r"><span>التخصص:</span><b>لغة فرنسية</b></div>
        <div class="r"><span>المستوى:</span><b>ليسانس سنة ثالثة</b></div>
      </div>
      <div class="year">السنة الجامعية 2026/2027</div>
    </div>
    <div class="num">1206222234300315</div>
    <div class="wave"></div>
   </div>
   <div class="face back">
    <div style="font-weight:bold;font-size:16px">جامعة قسنطينة 1</div>
    <div id="qr"></div>
    <div class="num">1206222234300315</div>
    <div class="note">تصميم شخصي · غير رسمي</div>
   </div>
  </div>
 </div>
</div>
<div class="hint">اضغط على البطاقة لقلبها</div>
<script>
new QRCode(document.getElementById("qr"),{text:location.href,width:220,height:220});
document.getElementById("card").addEventListener("click",function(){this.classList.toggle("on")});
</script>
</body>
</html>
