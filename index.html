<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقة الطالب</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 30%,#1c2433,#0b0e14);font-family:Tahoma,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
.scene{position:relative;width:92%;max-width:560px;aspect-ratio:1.75;perspective:900px;touch-action:none;cursor:grab}
.shadow{position:absolute;left:10%;right:10%;bottom:-9%;height:10%;background:radial-gradient(ellipse at center,#000c 0,transparent 70%);filter:blur(8px)}
.card3d{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.layer{position:absolute;inset:0;border-radius:14px;background:#b9bfc9;transform:translateZ(var(--z))}
.face{position:absolute;inset:0;border-radius:14px;box-sizing:border-box;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d}
.face *{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{transform:translateZ(5px);direction:ltr;padding:10px 14px 8px;color:#111;display:flex;flex-direction:column;
background:radial-gradient(#00000014 1px,transparent 1.3px) 0 0/7px 7px,linear-gradient(135deg,#fff,#eef1f5)}
.back{transform:rotateY(180deg) translateZ(5px);background:linear-gradient(135deg,#f6f7f9,#dfe4ea);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#223}
.sheen{position:absolute;inset:0;border-radius:14px;overflow:hidden;pointer-events:none;transform:translateZ(1px)}
.sheen i{position:absolute;top:0;bottom:0;width:38%;left:calc(var(--sx,50)*1%);background:linear-gradient(100deg,transparent,#fffa,transparent);transform:skewX(-20deg)}
.hd{direction:rtl;text-align:right;font-size:12px;font-weight:bold;color:#1d6b3a;transform:translateZ(6px)}
.title{direction:rtl;text-align:center;font-size:20px;font-weight:bold;margin:0 0 4px;transform:translateZ(10px)}
.body{flex:1;display:grid;grid-template-columns:22% 1fr 27%;gap:8px;align-items:center;transform-style:preserve-3d}
#qr{background:#fff;padding:4px;border-radius:6px;width:100%;aspect-ratio:1;box-sizing:border-box;transform:translateZ(8px);box-shadow:0 3px 8px #0003}
#qr img,#qr canvas{width:100%!important;height:100%!important}
.f{margin:2px 0}
.f small{display:block;font-size:7px;color:#666;text-align:right;direction:rtl}
.f .v{display:flex;justify-content:space-between;font-size:10px;font-weight:bold}
.f .v i{font-style:normal;direction:rtl}
.info{transform:translateZ(4px)}
.pf{transform:translateZ(18px)}
.pf img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border:2px solid #222;border-radius:4px;background:#fff;box-shadow:0 6px 14px #0006}
.wave{height:6px;margin:4px 0 3px;background:repeating-linear-gradient(90deg,#2f8f4e 0 5px,#b9d9c3 5px 10px);border-radius:3px;transform:translateZ(3px)}
.ft{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:bold;transform:translateZ(4px)}
.ft .y{direction:rtl}
.hint{color:#8a93a6;font-size:12px;margin-top:30px}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="shadow" id="shadow"></div>
  <div class="card3d" id="card">
    <div class="layer" style="--z:-4px"></div>
    <div class="layer" style="--z:-2px"></div>
    <div class="layer" style="--z:0px"></div>
    <div class="layer" style="--z:2px"></div>
    <div class="layer" style="--z:4px"></div>
    <div class="face front">
      <div class="hd">جامعة قسنطينة 1</div>
      <div class="title">بطاقة الطالب</div>
      <div class="body">
        <div id="qr"></div>
        <div class="info">
          <div class="f"><small>اللقب</small><div class="v"><span>IDJET</span><i>إيجات</i></div></div>
          <div class="f"><small>الاسم</small><div class="v"><span>OUAIL</span><i>وائل</i></div></div>
          <div class="f"><small>تاريخ ومكان الميلاد</small><div class="v"><span>2004/07/31</span><i>قسنطينة</i></div></div>
          <div class="f"><small>الميدان</small><div class="v"><span></span><i>آداب ولغات</i></div></div>
          <div class="f"><small>الفرع</small><div class="v"><span></span><i>لغة فرنسية</i></div></div>
        </div>
        <div class="pf"><img src="IMG_6713.jpeg" alt="صورة"></div>
      </div>
      <div class="wave"></div>
      <div class="ft"><span>222234300315</span><span class="y">السنة الجامعية 2026 / 2027</span></div>
      <div class="sheen"><i></i></div>
    </div>
    <div class="face back">
      <div style="font-weight:bold">جامعة قسنطينة 1</div>
      <div style="font-size:11px;margin-top:6px;opacity:.7">تصميم شخصي · غير رسمي</div>
      <div class="sheen"><i></i></div>
    </div>
  </div>
</div>
<div class="hint">اسحب لتدويرها · اضغط لقلبها</div>
<script>
new QRCode(document.getElementById("qr"),{text:location.origin+location.pathname,width:200,height:200});
var scene=document.getElementById("scene"),card=document.getElementById("card"),shadow=document.getElementById("shadow");
var rx=0,ry=0,trx=0,tryy=0,flip=0,tflip=0,drag=false,moved=false,sx0=0,sy0=0;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
scene.addEventListener("pointerdown",function(e){drag=true;moved=false;sx0=e.clientX;sy0=e.clientY;try{scene.setPointerCapture(e.pointerId)}catch(x){}});
scene.addEventListener("pointermove",function(e){
  if(!drag)return;
  var dx=e.clientX-sx0,dy=e.clientY-sy0;
  if(Math.hypot(dx,dy)>6)moved=true;
  tryy=clamp(dx*.3,-40,40);trx=clamp(-dy*.3,-30,30);
});
function up(){if(!drag)return;drag=false;if(!moved)tflip=tflip?0:180}
scene.addEventListener("pointerup",up);
scene.addEventListener("pointercancel",function(){drag=false});
function loop(t){
  if(!drag){tryy=Math.sin(t/1800)*10;trx=Math.cos(t/2300)*4}
  ry+=(tryy-ry)*.1
