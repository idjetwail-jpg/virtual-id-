<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقة الطالب</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 30%,#1c2433,#0b0e14);font-family:Tahoma,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
.scene{position:relative;width:92%;max-width:560px;aspect-ratio:1.6;perspective:900px;touch-action:none;cursor:grab}
.shadow{position:absolute;left:10%;right:10%;bottom:-9%;height:10%;background:radial-gradient(ellipse at center,#000c 0,transparent 70%);filter:blur(8px)}
.card3d{position:absolute;inset:0;transform-style:preserve-3d}
.layer{position:absolute;inset:0;border-radius:14px;background:#c9ccd3;transform:translateZ(var(--z))}
.face{position:absolute;inset:0;border-radius:14px;box-sizing:border-box;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;overflow:hidden}
.face *{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{transform:translateZ(5px);direction:ltr;padding:10px 14px 18px;color:#111;display:flex;flex-direction:column;
background:repeating-radial-gradient(circle at 58% 60%,rgba(214,90,110,.30) 0 1px,transparent 1px 5px),linear-gradient(120deg,#fbeff1 0%,#f6d9de 35%,#e6f1dc 70%,#f4f9ee 100%)}
.back{transform:rotateY(180deg) translateZ(5px);background:linear-gradient(135deg,#f6f7f9,#dfe4ea);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#223}
.sheen{position:absolute;inset:0;pointer-events:none}
.sheen i{position:absolute;top:0;bottom:0;width:38%;left:calc(var(--sx,50)*1%);background:linear-gradient(100deg,transparent,#fffa,transparent);transform:skewX(-20deg)}
.hd{direction:rtl;text-align:right;font-size:12px;font-weight:bold;color:#1d6b3a;transform:translateZ(6px)}
.title{direction:rtl;text-align:center;font-size:19px;font-weight:bold;color:#c0394f;margin:0 0 4px;transform:translateZ(10px)}
.body{flex:1;display:grid;grid-template-columns:22% 1fr 27%;gap:8px;align-items:center;transform-style:preserve-3d}
#qr{background:#fff;padding:4px;border-radius:6px;width:100%;aspect-ratio:1;box-sizing:border-box;transform:translateZ(8px);box-shadow:0 3px 8px #0003}
#qr img,#qr canvas{width:100%!important;height:100%!important}
.info{transform:translateZ(4px)}
.f{margin:2px 0}
.f small{display:block;font-size:7px;color:#666;text-align:right;direction:rtl}
.f .v{display:flex;justify-content:space-between;font-size:10px;font-weight:bold}
.f .v i{font-style:normal;direction:rtl}
.pf{transform:translateZ(18px);background:linear-gradient(#a8d58a,#6fae58);padding:5px;border-radius:14px}
.pf img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#fff;box-shadow:0 6px 14px #0006}
.wave{position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,#2f8f4e 0 6px,#a8d58a 6px 12px)}
.ft{position:absolute;left:14px;right:14px;bottom:10px;display:flex;justify-content:space-between;font-size:9px;font-weight:bold}
.ft .y{direction:rtl}
.hint{color:#8a93a6;font-size:12px;margin-top:30px}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="shadow" id="shadow"></div>
  <div class="card3d" id="card">
    <div class="layer" style="--z:-4px"></div>
    <div class="layer" style="--z:-2px"></div>
    <div class="layer" style="--z:0px"></div>
    <div class="layer" style="--z:2px"></div>
    <div class="layer" style="--z:4px"></div>
    <div class="face front">
      <div class="hd" id="uni"></div>
      <div class="title">بطاقة الطالب</div>
      <div class="body">
        <div id="qr"></div>
        <div class="info" id="info"></div>
        <div class="pf"><img id="photo" alt="صورة"></div>
      </div>
      <div class="ft"><span id="num"></span><span class="y" id="year"></span></div>
      <div class="wave"></div>
      <div class="sheen"><i></i></div>
    </div>
    <div class="face back">
      <div style="font-weight:bold" id="uni2"></div>
      <div style="font-size:11px;margin-top:6px;opacity:.7">تصميم شخصي · غير رسمي</div>
      <div class="sheen"><i></i></div>
    </div>
  </div>
</div>
<div class="hint">اسحب لتدويرها · اضغط لقلبها</div>
<script>
/* عدّل بياناتك هنا فقط */
var DATA={
  uni:"جامعة قسنطينة 1",
  photo:"IMG_6713.jpeg",
  num:"222234300315",
  year:"السنة الجامعية 2026 / 2027",
  fields:[
    ["اللقب","IDJET","إيجات"],
    ["الاسم","OUAIL","وائل"],
    ["تاريخ ومكان الميلاد","2004/07/31","قسنطينة"],
    ["الميدان","","آداب ولغات"],
    ["الفرع","","لغة فرنسية"],
    ["المستوى","","ليسانس سنة ثالثة"]
  ]
};
function $(i){return document.getElementById(i)}
$("uni").textContent=DATA.uni;$("uni2").textContent=DATA.uni;
$("photo").src=DATA.photo;$("num").textContent=DATA.num;$("year").textContent=DATA.year;
DATA.fields.forEach(function(r){
  var f=document.createElement("div");f.className="f";
  var s=document.createElement("small");s.textContent=r[0];
  var v=document.createElement("div");v.className="v";
  var a=document.createElement("span");a.textContent=r[1];
  var b=document.createElement("i");b.textContent=r[2];
  v.appendChild(a);v.appendChild(b);f.appendChild(s);f.appendChild(v);$("info").appendChild(f);
});
new QRCode($("qr"),{text:location.origin+location.pathname,width:200,height:200});
var scene=$("scene"),card=$("card"),shadow=$("shadow");
var rx=0,ry=0,trx=0,tryy=0,flip=0,tflip=0,drag=false,moved=false,sx0=0,sy0=0;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
scene.addEventListener("pointerdown",function(e){drag=true;moved=false;sx0=e.clientX;sy0=e.clientY;try{scene.setPointerCapture(e.pointerId)}catch(x){}});
scene.addEventListener("pointermove",function(e){
  if(!drag)return;
  var dx=e.clientX-sx0,dy=e.clientY-sy0;
  if(Math.hypot(dx,dy)>6)moved=true;
  tryy=clamp(dx*.3,-40,40);trx=clamp(-dy*.3,-30,30);
});
scene.addEventListener("pointerup",function(){if(!drag)return;drag=false;if(!moved)tflip=tflip?0:180});
scene.addEventListener("pointercancel",function(){drag=false});
function loop(t){
  if(!drag){tryy=Math.sin(t/1800)*10;trx=Math.cos(t/2300)*4}
  ry+=(tryy-ry)*.1;rx+=(trx-rx)*.1;flip+=(tflip-flip)*.12;
  card.style.transform="rotateX("+rx+"deg) rotateY("+(ry+flip)+"deg)";
  card.style.setProperty("--sx",50+ry*4);
  shadow.style.transform="translateX("+(-ry*1.5)+"px) scale("+(1-Math.abs(rx)/150)+")";
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
